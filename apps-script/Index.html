<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#16a34a">
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, Roboto, sans-serif; background:#f3f6f4; color:#1f2937; }
  header { background:#16a34a; color:#fff; padding:16px; text-align:center; font-size:20px; font-weight:600; }
  main { padding:14px; max-width:480px; margin:auto; }
  .card { background:#fff; border-radius:14px; padding:14px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .btn { display:block; width:100%; padding:15px; border:none; border-radius:12px; font-size:17px; font-weight:600; margin-top:10px; cursor:pointer; }
  .green { background:#16a34a; color:#fff; }
  .light { background:#e7f5ec; color:#166534; }
  .btn:disabled { opacity:.5; }
  #preview { width:100%; border-radius:12px; display:none; margin-top:10px; }
  input[type=text], input[type=number] { width:100%; padding:11px; border:1px solid #d1d5db; border-radius:10px; font-size:16px; margin-top:4px; }
  label { font-size:13px; color:#6b7280; display:block; margin-top:10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .totals { display:grid; grid-template-columns:repeat(4,1fr); text-align:center; gap:6px; }
  .totals b { display:block; font-size:20px; color:#16a34a; }
  .totals span { font-size:12px; color:#6b7280; }
  .meal { display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px solid #f0f0f0; }
  .items { font-size:13px; color:#4b5563; margin-top:6px; }
  #msg { text-align:center; font-size:15px; margin:8px 0; min-height:20px; }
  .err { color:#dc2626; } .ok { color:#16a34a; }
  #result { display:none; }
  h3 { margin:0 0 8px; font-size:16px; }
</style>
</head>
<body>
<header>🍽️ Food Calorie Tracker</header>
<main>

  <div class="card">
    <h3>Today</h3>
    <div class="totals">
      <div><b id="tCal">0</b><span>kcal</span></div>
      <div><b id="tPro">0</b><span>Protein g</span></div>
      <div><b id="tCarb">0</b><span>Carbs g</span></div>
      <div><b id="tFat">0</b><span>Fat g</span></div>
    </div>
    <div id="meals"></div>
  </div>

  <div class="card">
    <input type="file" id="camera" accept="image/*" capture="environment" hidden>
    <input type="file" id="gallery" accept="image/*" hidden>
    <button class="btn green" onclick="camera.click()">📷 Take Food Photo</button>
    <button class="btn light" onclick="gallery.click()">🖼️ Choose from Gallery</button>
    <img id="preview">
    <label>Note (optional) – e.g. "3 idli, 1 vada, coconut chutney"</label>
    <input type="text" id="note" placeholder="Helps get a better estimate">
    <button class="btn green" id="analyzeBtn" onclick="analyze()" disabled>🔍 Get Calories</button>
    <div id="msg"></div>
  </div>

  <div class="card" id="result">
    <h3>Check & Save</h3>
    <label>Food</label><input type="text" id="food">
    <div class="grid">
      <div><label>Calories (kcal)</label><input type="number" id="cal"></div>
      <div><label>Protein (g)</label><input type="number" id="pro"></div>
      <div><label>Carbs (g)</label><input type="number" id="carb"></div>
      <div><label>Fat (g)</label><input type="number" id="fat"></div>
    </div>
    <div class="items" id="items"></div>
    <button class="btn green" id="saveBtn" onclick="save()">✅ Save to Sheet</button>
  </div>

</main>
<script>
  let imgData = null;
  const $ = id => document.getElementById(id);

  function setMsg(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }

  function onPick(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        // shrink photo to max 1024px so upload is fast
        const max = 1024, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = img.width * s; c.height = img.height * s;
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const url = c.toDataURL('image/jpeg', 0.85);
        imgData = url.split(',')[1];
        $('preview').src = url; $('preview').style.display = 'block';
        $('analyzeBtn').disabled = false;
        $('result').style.display = 'none';
        setMsg('');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  }
  $('camera').onchange = onPick;
  $('gallery').onchange = onPick;

  function analyze() {
    $('analyzeBtn').disabled = true;
    setMsg('Analyzing your food… ⏳');
    google.script.run
      .withSuccessHandler(d => {
        $('analyzeBtn').disabled = false;
        setMsg('');
        $('food').value = d.food;
        $('cal').value = Math.round(d.calories);
        $('pro').value = Math.round(d.protein_g);
        $('carb').value = Math.round(d.carbs_g);
        $('fat').value = Math.round(d.fat_g);
        $('items').innerHTML = (d.items || []).map(i =>
          `• ${i.name} (${i.quantity}) – ${Math.round(i.calories)} kcal`).join('<br>');
        $('result').style.display = 'block';
        $('result').scrollIntoView({ behavior: 'smooth' });
      })
      .withFailureHandler(err => { $('analyzeBtn').disabled = false; setMsg(err.message, 'err'); })
      .analyzeFood(imgData, 'image/jpeg', $('note').value.trim());
  }

  function save() {
    $('saveBtn').disabled = true;
    google.script.run
      .withSuccessHandler(t => {
        $('saveBtn').disabled = false;
        showTotals(t);
        $('result').style.display = 'none';
        $('preview').style.display = 'none';
        $('note').value = ''; imgData = null; $('analyzeBtn').disabled = true;
        setMsg('Saved to your sheet ✅', 'ok');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      })
      .withFailureHandler(err => { $('saveBtn').disabled = false; setMsg(err.message, 'err'); })
      .saveEntry({ food: $('food').value, calories: $('cal').value,
                   protein_g: $('pro').value, carbs_g: $('carb').value, fat_g: $('fat').value });
  }

  function showTotals(t) {
    $('tCal').textContent = Math.round(t.calories);
    $('tPro').textContent = Math.round(t.protein_g);
    $('tCarb').textContent = Math.round(t.carbs_g);
    $('tFat').textContent = Math.round(t.fat_g);
    $('meals').innerHTML = t.meals.map(m =>
      `<div class="meal"><span>${m.time} · ${m.food}</span><span>${m.calories} kcal</span></div>`).join('');
  }

  google.script.run.withSuccessHandler(showTotals).getTodayTotals();
</script>
</body>
</html>
